server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: Todo

  # ----------------------------------------
  # Configuración de Base de Datos (H2)
  # ----------------------------------------
  datasource:
    url: jdbc:h2:mem:tododb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # Consola web H2 para visualizar datos (http://localhost:8080/h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console

  # ----------------------------------------
  # Configuración de JPA / Hibernate
  # ----------------------------------------
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # ----------------------------------------
  # Configuración de Flyway (Migraciones)
  # ----------------------------------------
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

